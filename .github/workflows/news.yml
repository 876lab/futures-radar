name: Update news feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_news.py
      - .github/workflows/news.yml

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Fetch headlines, Fear & Greed and calendar
        run: |
          mkdir -p out
          python3 scripts/fetch_news.py out/news.json
      - name: Publish to the news-data branch
        run: |
          cd out
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "Update news $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
